<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" aria-labelledby="t d">
  <title id="t">How the champion is trained and shipped</title>
  <desc id="d">Human replays are re-simulated and behaviour-cloned into an initial policy; self-play PPO then trains it against itself and a pool of frozen past champions, with EMA-smoothed weights leaving the loop; the champion is exported to a numpy-only bot that speaks the competition protocol.</desc>
  <rect width="960" height="744" fill="#fff"/>
  <style>
    .k{font:11px ui-monospace,monospace;letter-spacing:2px;fill:#6b6b62}
    .b{font:600 13px system-ui,sans-serif;fill:#171714}
    .s{font:11px system-ui,sans-serif;fill:#55554d}
    .m{font:11px ui-monospace,monospace;fill:#315cff}
    .box{fill:#fff;stroke:#d2cec0;stroke-width:1.3}
    .blue{fill:#eff2ff;stroke:#315cff;stroke-width:1.3}
    .red{fill:#fdece9;stroke:#f04f3d;stroke-width:1.3}
    .cy{fill:#e7f8f6;stroke:#189a92;stroke-width:1.3}
    .acid{fill:#d8ff43;stroke:#a8bf2d;stroke-width:1.3}
    .ghost{fill:#fff;stroke:#c3bfb1;stroke-width:1.3;stroke-dasharray:5 4}
    .lane{fill:none;stroke:#d2cec0;stroke-width:1;stroke-dasharray:3 4}
    .ln{stroke:#5c5c54;stroke-width:1.4;fill:none}
    .lnb{stroke:#315cff;stroke-width:1.7;fill:none}
    .lnc{stroke:#f04f3d;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5c5c54"/></marker>
    <marker id="ab" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#315cff"/></marker>
    <marker id="ac" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f04f3d"/></marker>
  </defs>

  <text x="20" y="34" class="k">FIGURE 02 / FROM HUMAN REPLAYS TO A BOT ON STDIN</text>

  <g transform="translate(0,44)">
    <!-- stage 1 -->
    <text class="k" x="20" y="34">STAGE 1 — BEHAVIOUR CLONING</text>
    <rect class="box" x="20" y="46" width="164" height="66" rx="2"/>
    <text class="b" x="102" y="70" text-anchor="middle">Human replays</text>
    <text class="s" x="102" y="87" text-anchor="middle">18 803 ranked 1v1 games</text>
    <text class="s" x="102" y="102" text-anchor="middle">moves only, old ruleset</text>
    <path class="ln" d="M184,79 L212,79" marker-end="url(#a)"/>
    <rect class="box" x="214" y="46" width="164" height="66" rx="2"/>
    <text class="b" x="296" y="70" text-anchor="middle">Re-simulate</text>
    <text class="s" x="296" y="87" text-anchor="middle">every tick through the</text>
    <text class="s" x="296" y="102" text-anchor="middle">engine · 99.4% legal</text>
    <path class="ln" d="M378,79 L406,79" marker-end="url(#a)"/>
    <rect class="blue" x="408" y="46" width="164" height="66" rx="2"/>
    <text class="b" x="490" y="70" text-anchor="middle">Supervised fit</text>
    <text class="s" x="490" y="87" text-anchor="middle">CE on the winner's moves</text>
    <text class="s" x="490" y="102" text-anchor="middle">build channel fully masked</text>
    <path class="ln" d="M572,79 L600,79" marker-end="url(#a)"/>
    <rect class="box" x="602" y="46" width="164" height="66" rx="2"/>
    <text class="b" x="684" y="70" text-anchor="middle">Re-init the build row</text>
    <text class="s" x="684" y="87" text-anchor="middle">near zero, negative bias —</text>
    <text class="s" x="684" y="102" text-anchor="middle">PPO raises it where it pays</text>
    <path class="ln" d="M766,79 L794,79" marker-end="url(#a)"/>
    <rect class="cy" x="796" y="46" width="144" height="66" rx="2"/>
    <text class="b" x="868" y="76" text-anchor="middle">BC init</text>
    <text class="m" x="868" y="94" text-anchor="middle">.eqx checkpoint</text>
    <path class="ln" d="M868,112 L868,140 L480,140 L480,192" marker-end="url(#a)"/>
    <text class="s" x="492" y="170">initial weights for the loop below</text>

    <!-- stage 2 -->
    <text class="k" x="20" y="184">STAGE 2 — SELF-PLAY PPO · JAX / EQUINOX</text>
    <rect class="lane" x="20" y="196" width="920" height="268" rx="3"/>

    <rect class="blue" x="60" y="222" width="240" height="94" rx="2"/>
    <text class="b" x="180" y="248" text-anchor="middle">Self-play rollout</text>
    <text class="s" x="180" y="266" text-anchor="middle">128 envs × 128 steps, bf16</text>
    <text class="s" x="180" y="282" text-anchor="middle">both seats vmapped as one batch</text>
    <text class="s" x="180" y="298" text-anchor="middle">terminal reward +1 / −1 / −0.5 draw</text>
    <path class="lnb" d="M300,269 L358,269" marker-end="url(#ab)"/>

    <rect class="blue" x="360" y="222" width="240" height="94" rx="2"/>
    <text class="b" x="480" y="248" text-anchor="middle">PPO update</text>
    <text class="s" x="480" y="266" text-anchor="middle">GAE γ = 1.0, λ = 0.7 · clip 0.2</text>
    <text class="s" x="480" y="282" text-anchor="middle">top-25% advantages · target KL 0.02</text>
    <text class="s" x="480" y="298" text-anchor="middle">power-law LR and entropy schedules</text>
    <path class="lnb" d="M600,269 L658,269" marker-end="url(#ab)"/>

    <rect class="cy" x="660" y="222" width="240" height="94" rx="2"/>
    <text class="b" x="780" y="248" text-anchor="middle">Weight smoothing</text>
    <text class="s" x="780" y="266" text-anchor="middle">EMA decay 0.999 on a shadow copy</text>
    <text class="s" x="780" y="282" text-anchor="middle">or an FFT low-pass over snapshots</text>
    <text class="m" x="780" y="300" text-anchor="middle">→ *_ema.eqx</text>

    <path class="lnb" d="M480,316 L480,348 L180,348 L180,318" marker-end="url(#ab)"/>
    <text class="s" x="336" y="339" text-anchor="middle">the updated policy plays the next rollout</text>

    <rect class="red" x="60" y="368" width="300" height="76" rx="2"/>
    <text class="b" x="210" y="392" text-anchor="middle">Frozen opponent pool</text>
    <text class="s" x="210" y="410" text-anchor="middle">past champions take the other seat in a share</text>
    <text class="s" x="210" y="425" text-anchor="middle">of envs; seats randomised, actions sampled —</text>
    <text class="s" x="210" y="440" text-anchor="middle">the answer to the self-play plateau</text>
    <path class="lnc" d="M120,368 L120,318" marker-end="url(#ac)"/>

    <rect class="box" x="600" y="368" width="300" height="76" rx="2"/>
    <text class="b" x="750" y="392" text-anchor="middle">Evaluation</text>
    <text class="s" x="750" y="410" text-anchor="middle">the heuristic ladder is saturated at 97–100%</text>
    <text class="s" x="750" y="425" text-anchor="middle">head-to-head against ancestors · the EklipZ bot</text>
    <text class="s" x="750" y="440" text-anchor="middle">only those two still measure progress</text>
    <path class="ln" d="M780,316 L780,366" marker-end="url(#a)"/>

    <!-- lineage -->
    <text class="k" x="20" y="500">CHAMPION LINEAGE</text>
    <rect class="box" x="20" y="512" width="212" height="52" rx="2"/>
    <text class="b" x="126" y="534" text-anchor="middle">cnn_r3_ema600</text>
    <text class="s" x="126" y="551" text-anchor="middle">H100 · 725 M agent-steps</text>
    <path class="ln" d="M232,538 L262,538" marker-end="url(#a)"/>
    <rect class="box" x="264" y="512" width="212" height="52" rx="2"/>
    <text class="b" x="370" y="534" text-anchor="middle">4070 overnight finetune</text>
    <text class="s" x="370" y="551" text-anchor="middle">beat its own seed 61% head-to-head</text>
    <path class="ln" d="M476,538 L506,538" marker-end="url(#a)"/>
    <rect class="acid" x="508" y="512" width="212" height="52" rx="2"/>
    <text class="b" x="614" y="534" text-anchor="middle">r4_ema — champion</text>
    <text class="s" x="614" y="551" text-anchor="middle">comp-cnn-4070-r4-local</text>
    <path class="ln" d="M720,538 L750,538" marker-end="url(#a)"/>
    <rect class="ghost" x="752" y="512" width="188" height="52" rx="2"/>
    <text class="b" x="846" y="534" text-anchor="middle">r5 recipe</text>
    <text class="s" x="846" y="551" text-anchor="middle">λ = 0.9, top-50%, on a 5090</text>

    <!-- stage 3 -->
    <text class="k" x="20" y="586">STAGE 3 — SUBMISSION</text>
    <path class="ln" d="M614,564 L614,602 L102,602 L102,616" marker-end="url(#a)"/>
    <rect class="box" x="20" y="618" width="212" height="62" rx="2"/>
    <text class="b" x="126" y="642" text-anchor="middle">export_submission_npz</text>
    <text class="s" x="126" y="659" text-anchor="middle">every JAX leaf flattened to fp32</text>
    <text class="m" x="126" y="674" text-anchor="middle">weights.npz · 10.5 MB</text>
    <path class="ln" d="M232,649 L262,649" marker-end="url(#a)"/>
    <rect class="cy" x="264" y="618" width="300" height="62" rx="2"/>
    <text class="b" x="414" y="642" text-anchor="middle">submission/cnn_bot/bot.py</text>
    <text class="s" x="414" y="659" text-anchor="middle">a numpy-only port of the forward pass, the</text>
    <text class="s" x="414" y="674" text-anchor="middle">observation state and the masks · argmax · no JAX</text>
    <path class="ln" d="M564,649 L594,649" marker-end="url(#a)"/>
    <rect class="box" x="596" y="618" width="344" height="62" rx="2"/>
    <text class="b" x="768" y="642" text-anchor="middle">Competition evaluator · stdio</text>
    <text class="s" x="768" y="659" text-anchor="middle">per turn: five scalars and three grids in, one move out</text>
    <text class="s" x="768" y="674" text-anchor="middle">a crash forfeits the game, so this bot never crashes</text>
  </g>
</svg>
