<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">GlobalContextCNN architecture</title>
<desc id="desc">Pipeline: 38-channel observation through a 1x1 stem, temporal and coordinate injection, six residual conv blocks with global-context injection after the third and fifth, splitting into per-cell policy logits and a distributional value head.</desc>
