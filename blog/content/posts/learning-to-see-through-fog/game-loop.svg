<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">The reinforcement learning loop in Generals</title><desc id="d">A game state becomes a fog-masked observation, the policy samples an action, and the environment returns reward and the next state.</desc>
  <rect width="1200" height="620" fill="#fff"/>
  <style>.h{font:32px Georgia,serif;fill:#171714}.k{font:11px ui-monospace,monospace;letter-spacing:2px;fill:#6b6b62}.b{font:15px system-ui,sans-serif;fill:#171714}.s{font:12px ui-monospace,monospace;fill:#6b6b62}</style>
  <text x="60" y="64" class="k">FIGURE 01 / ONE TURN IS ONE TRAINING EXAMPLE</text>
  <g transform="translate(60 120)">
    <rect width="230" height="330" rx="8" fill="#f4f1e8" stroke="#d2cec0"/><text x="22" y="36" class="h">World</text><text x="22" y="61" class="s">true GameState</text>
    <g transform="translate(25 95)"><rect width="180" height="180" fill="#161b22"/>
      <path d="M0 0h90v30h30v60H90v30H60v60H0z" fill="#315cff" opacity=".75"/><path d="M180 0h-60v60H90v60h30v60h60z" fill="#f04f3d" opacity=".75"/>
