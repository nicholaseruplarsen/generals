      <circle cx="15" cy="15" r="9" fill="#d8ff43"/><circle cx="165" cy="105" r="9" fill="#d8ff43"/>
    </g><text x="22" y="304" class="s">armies · ownership · terrain</text>
  </g>
  <path d="M300 285h86" stroke="#171714" stroke-width="2"/><path d="m375 276 12 9-12 9" fill="none" stroke="#171714" stroke-width="2"/>
  <g transform="translate(397 120)">
    <rect width="230" height="330" rx="8" fill="#eef1ff" stroke="#aab9ff"/><text x="22" y="36" class="h">Observation</text><text x="22" y="61" class="s">what blue can see</text>
    <g transform="translate(25 95)"><rect width="180" height="180" fill="#9da2aa"/><path d="M0 0h90v30h30v60H90v30H60v60H0z" fill="#315cff" opacity=".82"/>
      <path d="M30 0v180M60 0v180M90 0v180M120 0v180M150 0v180M0 30h180M0 60h180M0 90h180M0 120h180M0 150h180" stroke="#fff" opacity=".25"/>
      <path d="M120 0h60v180H60v-30h30V90h30z" fill="#c8c8c4" opacity=".92"/><text x="137" y="84" class="b" fill="#6b6b62">FOG</text>
    </g><text x="22" y="304" class="s">18 × 10 × 10 planes</text>
  </g>
  <path d="M637 285h86" stroke="#171714" stroke-width="2"/><path d="m712 276 12 9-12 9" fill="none" stroke="#171714" stroke-width="2"/>
  <g transform="translate(734 120)">
    <rect width="230" height="330" rx="8" fill="#e9faf8" stroke="#86dcd5"/><text x="22" y="36" class="h">Policy</text><text x="22" y="61" class="s">πθ(action | memory)</text>
    <g transform="translate(22 104)"><rect width="186" height="18" rx="9" fill="#d7dcdd"/><rect width="147" height="18" rx="9" fill="#315cff"/><text x="0" y="48" class="s">move stack right · 0.31</text>
      <rect y="70" width="186" height="18" rx="9" fill="#d7dcdd"/><rect y="70" width="83" height="18" rx="9" fill="#5dd9d0"/><text x="0" y="118" class="s">split upward · 0.17</text>
      <rect y="140" width="186" height="18" rx="9" fill="#d7dcdd"/><rect y="140" width="25" height="18" rx="9" fill="#f04f3d"/><text x="0" y="188" class="s">pass · 0.05</text></g>
    <text x="22" y="304" class="s">sample one of 801 actions</text>
