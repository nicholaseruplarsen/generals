<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">Agent progress and recurrent league failure</title><desc id="d">Historical agent scores improved from a scripted baseline to a Hunter-specialist PPO agent, while the newest recurrent league agent failed against every opponent.</desc>
  <rect width="1200" height="720" fill="#161b22"/>
  <style>.h{font:32px Georgia,serif;fill:#fff}.k{font:11px ui-monospace,monospace;letter-spacing:2px;fill:#8c96a5}.b{font:15px system-ui,sans-serif;fill:#fff}.s{font:12px ui-monospace,monospace;fill:#aeb5bf}.n{font:42px Georgia,serif;fill:#fff}</style>
  <text x="60" y="60" class="k">FIGURE 07 / PROGRESS IS NOT MONOTONIC</text>
  <g transform="translate(60 110)">
    <text x="0" y="0" class="h">Best historical field score</text><text x="0" y="29" class="s">draws count as ½ · 128 games per opponent</text>
    <line x1="0" y1="210" x2="520" y2="210" stroke="#45505f" stroke-width="2"/>
    <path d="M20 202L180 152L340 93L500 68" fill="none" stroke="#d8ff43" stroke-width="5"/>
    <g fill="#d8ff43"><circle cx="20" cy="202" r="8"/><circle cx="180" cy="152" r="8"/><circle cx="340" cy="93" r="8"/><circle cx="500" cy="68" r="8"/></g>
    <g class="s" text-anchor="middle"><text x="20" y="240">original</text><text x="20" y="258">0.465</text><text x="180" y="240">scripted</text><text x="180" y="258">0.682</text><text x="340" y="240">mixed PPO</text><text x="340" y="258">0.681</text><text x="500" y="240">Hunter PPO</text><text x="500" y="258">0.711</text></g>
    <text x="500" y="42" class="n" text-anchor="middle">.711</text>
  </g>
  <g transform="translate(660 110)">
    <text x="0" y="0" class="h">Hunter-specialist transfer</text><text x="0" y="29" class="s">accepted feed-forward policy · historical run</text>
    <g transform="translate(0 68)" class="s">
      <text y="18">Random</text><rect x="92" width="390" height="24" rx="3" fill="#2b3340"/><rect x="92" width="343" height="24" rx="3" fill="#315cff"/><text x="495" y="18">.879</text>
      <text y="62">Expander</text><rect x="92" y="44" width="390" height="24" rx="3" fill="#2b3340"/><rect x="92" y="44" width="280" height="24" rx="3" fill="#5d7cff"/><text x="495" y="62">.719</text>
      <text y="106">Hunter</text><rect x="92" y="88" width="390" height="24" rx="3" fill="#2b3340"/><rect x="92" y="88" width="285" height="24" rx="3" fill="#d8ff43"/><text x="495" y="106">.731</text>
      <text y="150">Baron</text><rect x="92" y="132" width="390" height="24" rx="3" fill="#2b3340"/><rect x="92" y="132" width="306" height="24" rx="3" fill="#5dd9d0"/><text x="495" y="150">.785</text>
      <text y="194">Blitz</text><rect x="92" y="176" width="390" height="24" rx="3" fill="#2b3340"/><rect x="92" y="176" width="172" height="24" rx="3" fill="#f04f3d"/><text x="495" y="194">.441</text>
    </g>
  </g>
  <line x1="60" y1="430" x2="1140" y2="430" stroke="#3d4652"/>
  <g transform="translate(60 485)"><text x="0" y="0" class="h">The latest 10M-step recurrent league run learned the wrong thing well.</text><text x="0" y="38" class="s">critic explained variance: 0.868 · sampled training win rate: ~0.7% · greedy evaluation below</text>
    <g transform="translate(0 78)" class="s" text-anchor="middle">
      <g><rect width="185" height="82" rx="5" fill="#252b34"/><text x="92" y="31">RANDOM</text><text x="92" y="62" class="n">1.11%</text></g>
      <g transform="translate(212)"><rect width="185" height="82" rx="5" fill="#252b34"/><text x="92" y="31">EXPANDER</text><text x="92" y="62" class="n">0.54%</text></g>
      <g transform="translate(424)"><rect width="185" height="82" rx="5" fill="#252b34"/><text x="92" y="31">HUNTER</text><text x="92" y="62" class="n">0.19%</text></g>
      <g transform="translate(636)"><rect width="185" height="82" rx="5" fill="#421f23"/><text x="92" y="31">BLITZ</text><text x="92" y="62" class="n">0.00%</text></g>
      <g transform="translate(848)"><rect width="185" height="82" rx="5" fill="#252b34"/><text x="92" y="31">FROZEN NET</text><text x="92" y="62" class="n">0.05%</text></g>
    </g>
  </g>
</svg>
