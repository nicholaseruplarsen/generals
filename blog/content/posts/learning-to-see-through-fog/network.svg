<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 650" role="img" aria-labelledby="t d">
  <title id="t">The CNN LSTM actor critic network</title><desc id="d">Observation planes pass through convolutions, a spatial projection, one LSTM layer, and separate actor and critic heads.</desc>
  <rect width="1250" height="650" fill="#161b22"/>
  <style>.h{font:32px Georgia,serif;fill:#fff}.k{font:11px ui-monospace,monospace;letter-spacing:2px;fill:#8c96a5}.b{font:15px system-ui,sans-serif;fill:#fff}.s{font:12px ui-monospace,monospace;fill:#aeb5bf}</style>
  <text x="60" y="62" class="k">FIGURE 02 / SPACE IN, MEMORY OUT</text>
  <g transform="translate(55 145)">
    <g><rect width="180" height="300" rx="7" fill="#202731" stroke="#4a5566"/><text x="20" y="36" class="h">18 planes</text><text x="20" y="62" class="s">10 × 10 each</text>
      <g transform="translate(28 95)" fill="none" stroke-width="2"><rect width="110" height="110" stroke="#315cff"/><rect x="12" y="12" width="110" height="110" stroke="#5dd9d0"/><rect x="24" y="24" width="110" height="110" stroke="#d8ff43"/><path d="M24 52h110M52 24v110M80 24v110M108 24v110M24 80h110M24 108h110" stroke="#69717e"/></g>
      <text x="20" y="273" class="s">fog · armies · legal moves</text></g>
    <path d="M190 150h54" stroke="#69717e" stroke-width="2"/>
    <g transform="translate(255 25)"><rect width="190" height="250" rx="7" fill="#263245" stroke="#5571a7"/><text x="22" y="38" class="h">CNN</text><text x="22" y="65" class="s">3 × 3 convolutions</text>
      <rect x="24" y="98" width="142" height="24" rx="4" fill="#315cff"/><rect x="38" y="134" width="128" height="24" rx="4" fill="#5277ff"/><rect x="52" y="170" width="114" height="24" rx="4" fill="#7d98ff"/><text x="22" y="226" class="s">64 spatial features</text></g>
    <path d="M455 150h54" stroke="#69717e" stroke-width="2"/>
    <g transform="translate(520 55)"><rect width="170" height="190" rx="7" fill="#252b30" stroke="#636d75"/><text x="22" y="38" class="h">Project</text><text x="22" y="65" class="s">6400 → 256</text><path d="M30 105h110M42 122h86M55 139h60" stroke="#d8ff43" stroke-width="6"/><text x="22" y="170" class="s">keep spatial identity</text></g>
    <path d="M700 150h54" stroke="#69717e" stroke-width="2"/>
    <g transform="translate(765 15)"><rect width="190" height="270" rx="90" fill="#183c3a" stroke="#5dd9d0"/><text x="95" y="80" class="h" text-anchor="middle">LSTM</text><text x="95" y="107" class="s" text-anchor="middle">256 hidden units</text><path d="M45 151c25-45 45 45 70 0s45 45 70 0" fill="none" stroke="#5dd9d0" stroke-width="4"/><text x="95" y="224" class="s" text-anchor="middle">remember hidden armies</text></g>
    <path d="M965 150h44" stroke="#69717e" stroke-width="2"/><path d="M1009 150l35-85M1009 150l35 85" stroke="#69717e" stroke-width="2"/>
    <g transform="translate(1040 5)"><rect width="130" height="120" rx="6" fill="#315cff"/><text x="18" y="38" class="h">Actor</text><text x="18" y="66" class="s" fill="#d5ddff">801 logits</text><text x="18" y="94" class="s" fill="#d5ddff">πθ(a|o,h)</text></g>
    <g transform="translate(1040 175)"><rect width="130" height="120" rx="6" fill="#eef1f4"/><text x="18" y="38" class="h" style="fill:#161b22">Critic</text><text x="18" y="66" class="s" style="fill:#59606d">1 scalar</text><text x="18" y="94" class="s" style="fill:#59606d">Vθ(o,h)</text></g>
  </g>
  <g transform="translate(55 515)"><rect width="1090" height="82" rx="5" fill="#202731" stroke="#3d4652"/><text x="24" y="33" class="b">Why memory?</text><text x="24" y="58" class="s">The same visible board can imply “enemy stack left” or “enemy stack right” depending on what happened 30 turns ago.</text></g>
</svg>
