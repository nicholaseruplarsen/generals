<!doctype html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}]})"></script>
</head>
<script>
  // dark is the default; only an explicit stored choice opts into the cream identity
  try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme','light'); } catch (e) {}
</script>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="Generals Research Notes home">
      <span>GENERALS / RESEARCH NOTES</span>
    </a>
    <div class="header-status"><span></span> FIELD LOG · 2026
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">LIGHT</button>
    </div>
  </header>
  {{ block "main" . }}{{ end }}
  <footer class="site-footer">
    <span>Built in public from measured games, failed runs, and profiler traces.</span>
    <a href="https://github.com/nicholaseruplarsen/generals-bots">Source</a>
  </footer>
  {{ $report := resources.Get "js/research-report.js" | minify | fingerprint }}
  <script src="{{ $report.RelPermalink }}" defer></script>
  <script>
  (() => {
    const root = document.documentElement, btn = document.querySelector('[data-theme-toggle]');
    if (!btn) return;
    const label = () => { btn.textContent = root.getAttribute('data-theme') === 'light' ? 'DARK' : 'LIGHT'; };
    btn.addEventListener('click', () => {
      const light = root.getAttribute('data-theme') !== 'light';
      if (light) root.setAttribute('data-theme','light'); else root.removeAttribute('data-theme');
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
      label();
    });
    const paint = () => {
      const t = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      document.querySelectorAll('.generals-game iframe').forEach(f => {
        try { f.contentDocument.documentElement.setAttribute('data-theme', t); } catch (e) {}
      });
    };
    document.querySelectorAll('.generals-game iframe').forEach(f => f.addEventListener('load', paint));
    btn.addEventListener('click', paint);
    paint();
    label();
  })();
  </script>
</body>
</html>
